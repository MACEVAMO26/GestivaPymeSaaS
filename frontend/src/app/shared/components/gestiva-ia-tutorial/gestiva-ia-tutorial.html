<div class="ia-tutorial-overlay" *ngIf="mostrar">
  <div class="ia-tutorial-modal" (click)="$event.stopPropagation()">
    <!-- HTML BOTON CERRAR GUIA -->
    <button class="btn-skip" (click)="cerrarTutorial()" title="Cerrar Guía">&times; Cerrar</button>

    <div class="ia-tutorial-content">
      <!-- HTML IMAGEN DE MASCOTA -->
      <div class="ia-mascot">
        <img src="assets/images/GestivaIA/IA_Gestiva.png" alt="Gestiva IA Mascot">
        <span class="mascot-badge">Asistente Gestiva</span>
      </div>

      <!-- HTML GLOBO DE DIALOGO EXPLICATIVO -->
      <div class="ia-dialogue">
        <div class="step-header">
          <span class="step-counter">Paso {{ pasoActual + 1 }} de {{ pasos.length }}</span>
          <h3 *ngIf="pasos.length > 0">{{ pasos[pasoActual].title }}</h3>
        </div>
        <p *ngIf="pasos.length > 0" class="step-desc">{{ pasos[pasoActual].description }}</p>

        <!-- HTML NAVEGACION Y BOTONES FUNCIONALES -->
        <div class="actions">
          <button
            type="button"
            class="btn-nav btn-anterior"
            (click)="anterior()"
            [disabled]="pasoActual === 0"
          >
            &larr; Anterior
          </button>

          @if (pasoActual < pasos.length - 1) {
            <button type="button" class="btn-nav btn-siguiente" (click)="siguiente()">
              Siguiente &rarr;
            </button>
          } @else {
            <button type="button" class="btn-nav btn-finalizar" (click)="finalizarTutorial()">
              ¡Empezar a Trabajar! &check;
            </button>
          }

          <button
            type="button"
            class="btn-omitir-link"
            (click)="finalizarTutorial()"
          >
            Omitir Guía
          </button>
        </div>
        
        <!-- HTML INDICADORES DE PASO CLICKEABLES -->
        <div class="step-indicators">
          <button
            *ngFor="let p of pasos; let i = index"
            type="button"
            class="step-dot"
            [class.active]="pasoActual === i"
            (click)="irAPaso(i)"
            [title]="'Ir al paso ' + (i + 1)"
          ></button>
        </div>
      </div>
    </div>
  </div>
</div>
